name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'xquty-aim-assistant/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build XQUTY debug APK
        run: gradle --no-daemon -p xquty-aim-assistant assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xquty-aim-assistant-debug-apk
          path: xquty-aim-assistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
