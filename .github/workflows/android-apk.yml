name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'xquty-aim-assistant/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle -p xquty-aim-assistant testDebugUnitTest
      - name: Build XQUTY debug APK
        run: gradle --no-daemon -p xquty-aim-assistant assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: xquty-aim-assistant-debug-apk
          path: xquty-aim-assistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
